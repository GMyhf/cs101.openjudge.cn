<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playground · CS101</title><link rel="stylesheet" href="/static/theme.css"><style>
html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink)}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;align-items:center;gap:9px;color:inherit;text-decoration:none;font-weight:700}.mark{display:grid;place-items:center;width:32px;height:32px;background:var(--accent);color:white;border-radius:6px}.nav{display:flex;gap:16px;align-items:center}.nav a{color:var(--muted);text-decoration:none}.nav a:hover{color:var(--accent)}main{flex:1;min-height:0;padding:18px 24px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:16px}.panel{min-height:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft)}.bar h1{font-size:17px;margin:0}.bar select,.bar button,.actions button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:inherit;cursor:pointer}.bar select{min-width:150px}.bar button:hover,.actions button:hover{border-color:var(--accent)}.editor{display:grid;grid-template-columns:44px 1fr;flex:1;min-height:0}.gutter{padding:13px 8px;text-align:right;background:var(--soft);border-right:1px solid var(--line);color:var(--muted);font:13px/1.55 ui-monospace,monospace;white-space:pre;overflow:hidden}.code{width:100%;height:100%;box-sizing:border-box;resize:none;border:0;outline:0;padding:13px;font:13px/1.55 ui-monospace,monospace;background:var(--panel);color:var(--ink);tab-size:4}.codewrap{position:relative;min-width:0;min-height:0}.highlight{position:absolute;inset:0;margin:0;padding:13px;overflow:auto;pointer-events:none;white-space:pre;font:13px/1.55 ui-monospace,monospace;color:var(--ink)}.code{position:relative;background:transparent;color:transparent;caret-color:var(--ink)}.kw{color:#8250df}.str{color:#0a7b47}.com{color:var(--muted);font-style:italic}.side{display:grid;grid-template-rows:minmax(180px,1fr) minmax(180px,1fr);gap:16px;min-height:0}.side.hide-input{grid-template-rows:0 minmax(180px,1fr)}.side.hide-input>.panel:first-child{display:none}.input,.output{flex:1;min-height:0;width:100%;box-sizing:border-box;resize:none;border:0;outline:0;padding:13px;font:13px/1.55 ui-monospace,monospace;background:var(--panel);color:var(--ink)}.output{white-space:pre;overflow:auto}.output.error{color:var(--danger)}.actions{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--soft)}.run{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;font-weight:700}.status{font-size:12px;color:var(--muted)}@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}.side{grid-template-rows:220px 220px}.panel:first-child{min-height:55vh}.top{padding:0 14px}.nav a:not(:last-child){display:none}}
</style></head><body><header class="top"><a class="brand" href="/"><span class="mark">CS</span><span>CS101 Playground</span></a><nav class="nav"><a href="/problems/">题库</a><a href="/history/">提交记录</a><button id="theme" type="button">深色</button></nav></header><main><section class="panel"><div class="bar"><h1>代码</h1><span><select id="language" aria-label="选择语言"><option value="python">Python 3</option><option value="pypy3">PyPy 3</option><option value="cpp">C++17</option><option value="c">C11</option><option value="csharp">C#</option><option value="fsharp">F#</option><option value="vbnet">VB.NET</option><option value="swift">Swift</option><option value="objc">Objective-C</option></select> <button id="clear" type="button">清空</button></span></div><div class="editor"><pre class="gutter" id="gutter">1</pre><textarea class="code" id="code" spellcheck="false" placeholder="输入代码…"></textarea></div><div class="actions"><span class="status" id="status">就绪</span><button class="run" id="run" type="button">运行</button></div></section><div class="side"><section class="panel"><div class="bar"><h1>标准输入</h1><button id="sample" type="button">填入示例</button></div><textarea class="input" id="input" spellcheck="false" placeholder="程序从这里读取输入…"></textarea></section><section class="panel"><div class="bar"><h1>运行输出</h1><button id="copy" type="button">复制</button></div><pre class="output" id="output">点击“运行”查看结果。</pre></section></div></main><script>
const code=document.querySelector('#code'),input=document.querySelector('#input'),output=document.querySelector('#output'),status=document.querySelector('#status'),gutter=document.querySelector('#gutter'),lang=document.querySelector('#language');let userKey='';
const defaults={python:'print("Hello, CS101!")',pypy3:'print("Hello, CS101!")',cpp:'#include <iostream>\nusing namespace std;\nint main(){ cout << "Hello, CS101!\\n"; }',c:'#include <stdio.h>\nint main(){ puts("Hello, CS101!"); }'};
function key(){return 'cs101-playground-'+userKey+'-'+lang.value} function refresh(){const n=Math.max(1,code.value.split('\n').length);gutter.textContent=Array.from({length:n},(_,i)=>i+1).join('\n');localStorage.setItem(key(),code.value)}
function load(){code.value=localStorage.getItem(key())||defaults[lang.value]||'';refresh()}lang.addEventListener('change',load);code.addEventListener('input',refresh);document.querySelector('#clear').onclick=()=>{code.value='';refresh();code.focus()};document.querySelector('#sample').onclick=()=>{input.value='';input.focus()};
document.querySelector('#copy').onclick=async()=>{await navigator.clipboard?.writeText(output.textContent);status.textContent='已复制输出'};
document.querySelector('#run').onclick=async()=>{if(!code.value.trim()){status.textContent='请先输入代码';return}status.textContent='运行中…';output.className='output';try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({book:'practice',problem:'31183',language:lang.value,source:code.value,stdin:input.value})});const d=await r.json();output.textContent=d.stdout??d.message??JSON.stringify(d,null,2);if(d.status!=='OK')output.className='output error';status.textContent=(d.status||'完成')+(d.time_ms?` · ${d.time_ms} ms`:'')}catch(e){output.textContent='网络错误：'+e;output.className='output error';status.textContent='运行失败'}};
document.querySelector('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem('cs101-theme',dark?'light':'dark')};document.documentElement.dataset.theme=localStorage.getItem('cs101-theme')||'light';fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(!d.authenticated){location.href='/auth/login/?next=/playground/';return}userKey=d.user;load()}).catch(()=>location.href='/auth/login/?next=/playground/');
// Editor affordances: lightweight language-aware highlighting and shareable drafts.
const wrap=code.parentElement;wrap.classList.add('codewrap');const hi=document.createElement('pre');hi.id='highlight';hi.className='highlight';wrap.insertBefore(hi,code);
function paint(){let s=code.value.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));s=s.replace(/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/g,'<span class="str">$1</span>');if(lang.value!=='python')s=s.replace(/\b(include|using|int|void|return|class|public|private|static|new|if|else|for|while|const|auto)\b/g,'<span class="kw">$1</span>');else s=s.replace(/\b(def|return|import|from|class|if|else|elif|for|while|in|True|False|None|print)\b/g,'<span class="kw">$1</span>');hi.innerHTML=s+'\n';hi.scrollTop=code.scrollTop;hi.scrollLeft=code.scrollLeft}code.addEventListener('input',paint);code.addEventListener('scroll',()=>{hi.scrollTop=code.scrollTop;hi.scrollLeft=code.scrollLeft});lang.addEventListener('change',paint);
const tools=lang.parentElement;const check=document.createElement('button');check.textContent='语法检查';check.onclick=()=>{const pairs={'(':')','[':']','{':'}'};const stack=[];for(const c of code.value){if(pairs[c])stack.push(pairs[c]);else if(')]}'.includes(c)&&stack.pop()!==c){status.textContent='语法检查：括号不匹配';return}}status.textContent=stack.length?'语法检查：括号不匹配':`语法检查：${lang.options[lang.selectedIndex].text} 基本检查通过`};tools.insertBefore(check,document.querySelector('#clear'));
const share=document.createElement('button');share.textContent='分享';share.onclick=async()=>{location.hash=btoa(unescape(encodeURIComponent(JSON.stringify({language:lang.value,source:code.value,input:input.value}))));await navigator.clipboard?.writeText(location.href);status.textContent='分享链接已复制'};tools.insertBefore(share,document.querySelector('#clear'));
const toggle=document.createElement('button');toggle.textContent='隐藏输入';toggle.onclick=()=>{const side=document.querySelector('.side');const hidden=side.classList.toggle('hide-input');toggle.textContent=hidden?'显示输入':'隐藏输入'};document.querySelector('.side .bar button').replaceWith(toggle);
if(location.hash.length>1){try{const d=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));if(d.language)lang.value=d.language;if(typeof d.source==='string')code.value=d.source;if(typeof d.input==='string')input.value=d.input}catch(e){}}paint();
</script></body></html>
