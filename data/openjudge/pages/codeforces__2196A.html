<dl class="problem-content"><dt>题解摘要</dt><dd><pre>【汤立祥 25物理学院 】思路：博弈题，好玩又简单的小巧思。整个博弈的核心就在于注意到两人可以通过交替减不同的数来保证 $q-p$ 始终为定值。由此，如果一开始 $q-p=a$，那么 Bob 只需要将 $q$ 减到 $2a$，$p$ 减到 $3a$，那么就轻松胜利。因此我们只需要判断 $q\geq2a,p\geq3a$ 即可知道 Bob 一定赢。</pre></dd>
