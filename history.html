<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
__THEME_HEAD__
<title>提交记录 · CS101</title>
<style>
  * { box-sizing:border-box; }
  body { font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink);
         margin:0; padding:0 0 60px; }
  /* 这条一直缺着：markup 里有 .wrap，但没有任何地方给它规则，整页贴着左边框。
     题库页的人数现在点进来就是这一页，顺手补上。 */
  .wrap { max-width:1180px; margin:0 auto; padding:22px 16px 0; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .sub a { color:var(--accent); }
  .cards { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 18px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:10px 14px; background:var(--bg); min-width:104px; }
  .stat b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); font-size:13px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 12px; }
  input[type=search], select { padding:8px 10px; border:1px solid var(--line); border-radius:5px; font:inherit; }
  input[type=search] { flex:1; min-width:180px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-size:13px; font-weight:600; }
  tr:hover td { background:var(--bg); }
  td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  a.pid { color:var(--accent); text-decoration:none; font-weight:600; }
  a.pid:hover { text-decoration:underline; }
  .badge { display:inline-block; padding:1px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .b-ac { background:var(--badge-ac-bg); color:var(--ok); }
  .b-wa { background:var(--badge-wa-bg); color:var(--badge-wa-fg); }
  .b-other { background:var(--badge-other-bg); color:var(--badge-other-fg); }
  .b-info { background:var(--badge-info-bg); color:var(--badge-info-fg); }
  .muted { color:var(--muted); }
  .empty { padding:40px 0; text-align:center; color:var(--muted); }
  .table-wrap { overflow-x:auto; }
  .history-results { min-width:900px; }
  .history-results th, .history-results td { white-space:nowrap; }
</style>
<header class="topbar"><a class="brand" href="/"><span class="mark">CS</span><span>CS101 题库</span></a><nav class="topnav"><a href="/problems/">题库</a><a href="/history/">提交记录</a><a href="/help/">说明</a><button id="theme" type="button" class="ghost theme-toggle">深色</button><a id="account" href="/auth/login/">登录</a></nav></header>
<div class="wrap">
<h1 id="pageTitle">提交记录</h1>
<p class="sub" id="who">读取中…</p>

<div class="cards" id="stats"></div>
<div class="bar">
  <input type="search" id="q" placeholder="按题号筛选" autocomplete="off">
  <select id="verdict"><option value="">全部结果</option></select>
  <select id="limit">
    <option value="50">最近 50 条</option>
    <option value="200">最近 200 条</option>
    <option value="500">最近 500 条</option>
  </select>
  <span class="muted" id="truncated" hidden></span>
</div>

<div class="table-wrap"><table class="history-results">
  <thead><tr id="headers"></tr></thead>
  <tbody id="rows"></tbody>
</table></div>
<p class="empty" id="empty" hidden>没有符合条件的提交。</p>

<script>
const CLS = { "Accepted": "b-ac", "Wrong Answer": "b-wa" };
const INFO = ["No Test Data", "Problem Not Found", "Empty Source", "Source Too Large"];
const LANGS = {python:'Python3', pypy3:'PyPy3', cpp:'G++', c:'GCC', csharp:'C#', fsharp:'F#',
               vbnet:'VB.NET', swift:'Swift', objc:'Objective-C'};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const badge = s => '<span class="badge ' + (CLS[s] || (INFO.includes(s) ? "b-info" : "b-other")) + '">' + esc(s) + "</span>";
let all = [];
const query = new URLSearchParams(location.search);
const mine = query.get("mine") === "1";
const queryUser = query.get("user") || "";
const queryBook = query.get("book") || "";
const queryProblem = query.get("problem") || "";
const titleOf = s => (s.title || s.problem).replace(
  new RegExp('^' + s.problem + '\\s*[:：]\\s*', 'i'), '') || s.problem;

function render() {
  const term = q.value.trim().toLowerCase();
  const want = verdict.value;
  const hits = all.filter(s =>
    (!want || s.result === want) &&
    (!term || String(s.problem).toLowerCase().includes(term)));
  empty.hidden = hits.length > 0;
  const scoped = mine || queryUser;
  headers.innerHTML = (scoped ? [] : ['提交人']).concat(
    ['题库名', '题目', '结果', '内存', '时间', '代码长度', '语言', '提交时间'])
    .map(label => `<th>${label}</th>`).join('');
  rows.innerHTML = hits.map(s => {
    const bookPath = s.book ? `/book/${encodeURIComponent(s.book)}/` : '';
    const problemPath = s.book ? `/${encodeURIComponent(s.book)}/${encodeURIComponent(s.problem)}/` : '';
    const solutionPath = s.book && s.id
      ? `/book/${encodeURIComponent(s.book)}/solution/${encodeURIComponent(s.id)}/` : '';
    const submitter = scoped ? '' : `<td><a class="pid" href="/history/?user=${encodeURIComponent(s.user || '')}">${esc(s.name || s.user || '')}</a></td>`;
    return `<tr>
      ${submitter}
      <td>${bookPath ? `<a class="pid" href="${bookPath}">${esc(s.book_name || s.book)}</a>` : esc(s.book_name || s.book || '')}</td>
      <td>${problemPath ? `<a class="pid" href="${problemPath}">${esc(s.problem)}:${esc(titleOf(s))}</a>` : esc(s.problem)}</td>
      <td>${solutionPath ? `<a class="verdict-link" href="${solutionPath}">${badge(s.result)}</a>` : badge(s.result)}</td>
      <td class="num muted">${s.memory_kb == null ? '—' : esc(s.memory_kb + ' kB')}</td>
      <td class="num muted">${s.time_ms == null ? '—' : esc(s.time_ms + ' ms')}</td>
      <td class="num muted">${s.source_bytes == null ? '—' : esc(s.source_bytes + ' B')}</td>
      <td class="muted">${esc(s.language_version || LANGS[s.language] || s.language || '—')}</td>
      <td class="num muted">${esc(s.created)}</td>
    </tr>`;
  }).join("");
}

function paintStats() {
  const total = all.length;
  const ac = all.filter(s => s.result === "Accepted").length;
  const solved = new Set(all.filter(s => s.result === "Accepted").map(s => s.problem)).size;
  const tried = new Set(all.map(s => s.problem)).size;
  stats.innerHTML =
      `<div class="stat"><b>${total}</b><span>提交次数</span></div>`
    + `<div class="stat"><b>${ac}</b><span>通过次数</span></div>`
    + `<div class="stat"><b>${solved}/${tried}</b><span>通过题数 / 尝试题数</span></div>`
    + `<div class="stat"><b>${total ? Math.round(ac / total * 100) : 0}%</b><span>通过率</span></div>`;
  const kinds = [...new Set(all.map(s => s.result))].sort();
  const keep = verdict.value;
  verdict.innerHTML = '<option value="">全部结果</option>'
    + kinds.map(k => `<option value="${esc(k)}"${k === keep ? " selected" : ""}>${esc(k)}</option>`).join("");
}

// 从题库页的「通过人数 / 尝试人数」点进来就是这道题的统计页，默认拉满 ——
// 上面那四张统计卡是拿返回的行算出来的，默认 50 条会让它们算出一个偏小的数
// 却看起来像全量结论。截断时下面还会明说「已达上限」。
if (queryProblem) {
  limit.value = "500";
  pageTitle.textContent = queryProblem + " · 提交统计";
  document.title = queryProblem + " · 提交统计 · CS101";
}

async function load() {
  const params = new URLSearchParams({ limit: limit.value });
  if (mine) params.set("mine", "1");
  else if (queryUser) params.set("user", queryUser);
  if (queryBook) params.set("book", queryBook);
  if (queryProblem) params.set("problem", queryProblem);
  const r = await fetch("/api/submissions?" + params, { credentials: "same-origin" });
  if (r.status === 401) {
    who.innerHTML = '<a href="/auth/login/">请先登录</a>后查看提交记录。';
    empty.hidden = false; empty.textContent = "登录后这里会列出你的提交。";
    return;
  }
  const data = await r.json();
  all = data.submissions || [];
  if (mine) {
    pageTitle.textContent = '我的提交记录';
    document.title = '我的提交记录 · CS101';
  } else if (queryUser) {
    const label = data.scope_name || data.scope_user || queryUser;
    pageTitle.textContent = label + '的提交记录';
    document.title = label + '的提交记录 · CS101';
  }
  const scope = queryProblem ? ' · 当前题目：<b>' + esc(queryProblem) + '</b>' : '';
  const back = queryBook ? ' · <a href="/book/' + encodeURIComponent(queryBook) + '/">返回题库</a>' : '';
  who.innerHTML = '登录为 <b>' + esc(data.user) + '</b>' + scope + back + ' · <a href="/problems/">题库目录</a> · <a href="/">首页</a>';
  truncated.hidden = all.length < Number(limit.value);
  truncated.textContent = '已达上限，下面的统计只算这 ' + all.length + ' 条';
  paintStats();
  render();
}

for (const el of [q, verdict]) el.addEventListener("input", render);
limit.addEventListener("change", load);
load();
</script>
 </div>
<script>const themeBtn=document.querySelector('#theme');function applyTheme(n){document.documentElement.dataset.theme=n;themeBtn.textContent=n==='dark'?'浅色':'深色';try{localStorage.setItem('cs101-theme',n)}catch(e){}}applyTheme(document.documentElement.dataset.theme==='dark'?'dark':'light');themeBtn.onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');fetch('/api/me').then(r=>r.json()).then(d=>{if(d.authenticated){account.textContent=d.user;account.href='/history/?mine=1'}}).catch(()=>{});</script>
</html>
