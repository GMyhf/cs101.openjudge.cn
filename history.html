<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/theme.css">
<script>(function(){try{var t=localStorage.getItem('cs101-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='light';}})();</script>
<title>提交记录 · CS101</title>
<style>
  * { box-sizing:border-box; }
  body { font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink);
         max-width:980px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .sub a { color:var(--accent); }
  .cards { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 18px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:10px 14px; background:var(--bg); min-width:104px; }
  .stat b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); font-size:13px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 12px; }
  input[type=search], select { padding:8px 10px; border:1px solid var(--line); border-radius:5px; font:inherit; }
  input[type=search] { flex:1; min-width:180px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-size:13px; font-weight:600; }
  tr:hover td { background:var(--bg); }
  td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  a.pid { color:var(--accent); text-decoration:none; font-weight:600; }
  a.pid:hover { text-decoration:underline; }
  .badge { display:inline-block; padding:1px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .b-ac { background:var(--badge-ac-bg); color:var(--ok); }
  .b-wa { background:var(--badge-wa-bg); color:var(--bad); }
  .b-other { background:var(--badge-other-bg); color:var(--badge-other-fg); }
  .b-info { background:var(--badge-info-bg); color:var(--badge-info-fg); }
  .muted { color:var(--muted); }
  .empty { padding:40px 0; text-align:center; color:var(--muted); }
  details summary { color:var(--accent); cursor:pointer; }
  pre.source { max-width:620px; max-height:360px; overflow:auto; margin:8px 0 0; padding:10px; border:1px solid var(--line); border-radius:5px; background:var(--bg); white-space:pre; font:12px/1.5 ui-monospace,monospace; }
</style>
<h1>提交记录</h1>
<p class="sub" id="who">读取中…</p>

<div class="cards" id="stats"></div>
<div class="bar">
  <input type="search" id="q" placeholder="按题号筛选" autocomplete="off">
  <select id="verdict"><option value="">全部结果</option></select>
  <select id="limit">
    <option value="50">最近 50 条</option>
    <option value="200">最近 200 条</option>
    <option value="500">最近 500 条</option>
  </select>
</div>

<table>
  <thead><tr><th>提交人</th><th>结果</th><th>内存</th><th>时间</th><th>代码长度</th><th>语言</th><th>提交时间</th><th>题目</th><th>代码/详情</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<p class="empty" id="empty" hidden>没有符合条件的提交。</p>

<script>
const CLS = { "Accepted": "b-ac", "Wrong Answer": "b-wa" };
const INFO = ["No Test Data", "Problem Not Found", "Empty Source", "Source Too Large"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const badge = s => '<span class="badge ' + (CLS[s] || (INFO.includes(s) ? "b-info" : "b-other")) + '">' + esc(s) + "</span>";
let all = [], currentUser = "";
const query = new URLSearchParams(location.search);
const queryBook = query.get("book") || "";
const queryProblem = query.get("problem") || "";

function detailOf(s) {
  const d = s.detail || {};
  if (d.case !== undefined) return "第 " + d.case + " 组出错";
  if (d.cases !== undefined) return d.cases + " 组全部通过";
  return "";
}

function detailMarkup(s) {
  const d = s.detail || {};
  const blocks = [];
  if (d.case !== undefined) blocks.push("<div><b>出错的数据组：</b>第 " + esc(d.case) + " 组</div>");
  if (d.expected_tokens !== undefined) blocks.push("<div><b>输出规模：</b>期望 " + esc(d.expected_tokens) + " 个 token，实际 " + esc(d.actual_tokens) + " 个</div>");
  if (d.message) blocks.push("<pre class='source result-message'>" + esc(d.message) + "</pre>");
  if (d.failing_input) blocks.push("<pre class='source'>" + esc(d.failing_input.text || "") + "</pre>");
  if (d.expected_output) blocks.push("<pre class='source'>" + esc(d.expected_output.text || "") + "</pre>");
  if (!blocks.length) return "";
  const open = s.result === "Accepted" ? "" : " open";
  return "<details class='result-detail'" + open + "><summary>查看判题详情</summary>" + blocks.join("") + "</details>";
}

function relativeTime(value) {
  const then = Date.parse(String(value).replace(" ", "T") + "Z");
  if (Number.isNaN(then)) return value;
  const minutes = Math.max(0, Math.floor((Date.now() - then) / 60000));
  if (minutes < 1) return "刚刚";
  if (minutes < 60) return minutes + "分钟前";
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return hours + "小时前";
  return Math.floor(hours / 24) + "天前";
}

function render() {
  const term = q.value.trim().toLowerCase();
  const want = verdict.value;
  const hits = all.filter(s =>
    (!want || s.result === want) &&
    (!term || String(s.problem).toLowerCase().includes(term)));
  empty.hidden = hits.length > 0;
  rows.innerHTML = hits.map(s => {
    const path = s.book ? "/" + s.book + "/" + s.problem + "/" : "";
    const code = s.source ? `<details><summary>查看代码</summary><pre class="source">${esc(s.source)}</pre></details>` : "";
    const d = s.detail || {};
    const memory = d.memory_kb !== undefined ? d.memory_kb + "kB" : "";
    const elapsed = d.time_ms !== undefined ? d.time_ms + "ms" : "";
    const size = d.source_bytes !== undefined ? d.source_bytes + " B" : (s.source ? new TextEncoder().encode(s.source).length + " B" : "");
    const extra = detailMarkup(s) || (detailOf(s) ? `<div class="muted">${esc(detailOf(s))}</div>` : "");
    return `<tr>
      <td>${esc(s.user || "")}</td>
      <td>${badge(s.result)}</td>
      <td class="num muted">${esc(memory)}</td>
      <td class="num muted">${esc(elapsed)}</td>
      <td class="num muted">${esc(size)}</td>
      <td class="muted">${esc((s.detail && s.detail.language_version) || s.language || "")}</td>
      <td class="num muted" title="${esc(s.created)}">${esc(relativeTime(s.created))}</td>
      <td>${path ? `<a class="pid" href="${path}">${esc(s.problem)}</a>` : esc(s.problem)}</td>
      <td>${code}${extra}</td>
    </tr>`;
  }).join("");
}

function paintStats() {
  const total = all.length;
  const ac = all.filter(s => s.result === "Accepted").length;
  const solved = new Set(all.filter(s => s.result === "Accepted").map(s => s.problem)).size;
  const tried = new Set(all.map(s => s.problem)).size;
  stats.innerHTML =
      `<div class="stat"><b>${total}</b><span>提交次数</span></div>`
    + `<div class="stat"><b>${ac}</b><span>通过次数</span></div>`
    + `<div class="stat"><b>${solved}/${tried}</b><span>通过题数 / 尝试题数</span></div>`
    + `<div class="stat"><b>${total ? Math.round(ac / total * 100) : 0}%</b><span>通过率</span></div>`;
  const kinds = [...new Set(all.map(s => s.result))].sort();
  const keep = verdict.value;
  verdict.innerHTML = '<option value="">全部结果</option>'
    + kinds.map(k => `<option value="${esc(k)}"${k === keep ? " selected" : ""}>${esc(k)}</option>`).join("");
}

async function load() {
  const mine = new URLSearchParams(location.search).get("mine") === "1";
  const params = new URLSearchParams({ limit: limit.value });
  if (mine) params.set("mine", "1");
  if (queryBook) params.set("book", queryBook);
  if (queryProblem) params.set("problem", queryProblem);
  const r = await fetch("/api/submissions?" + params, { credentials: "same-origin" });
  if (r.status === 401) {
    who.innerHTML = '<a href="/auth/login/">请先登录</a>后查看提交记录。';
    empty.hidden = false; empty.textContent = "登录后这里会列出你的提交。";
    return;
  }
  const data = await r.json();
  all = data.submissions || [];
  currentUser = data.user || "";
  const scope = queryProblem ? ' · 当前题目：<b>' + esc(queryProblem) + '</b>' : '';
  who.innerHTML = '登录为 <b>' + esc(data.user) + '</b>' + scope + ' · <a href="/problems/">题库目录</a> · <a href="/">首页</a>';
  paintStats();
  render();
}

for (const el of [q, verdict]) el.addEventListener("input", render);
limit.addEventListener("change", load);
load();
</script>
</html>
