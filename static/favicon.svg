<!-- 标签页图标。形状照抄站内导航栏左上那个 .mark（圆角方块 + CS）。
     填的是主色，不是那个近黑的正文色：16px 下近黑方块在深色标签栏里几乎看不见。
     字形只写通用族，不指定 system-ui —— 渲染 favicon 的进程不一定加载得到它。
     注意：XML 注释里不能出现连续两个减号，写 CSS 变量名会让整份 SVG 解析失败。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#237a50"/>
  <text x="32" y="44" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold"
        fill="#ffffff">CS</text>
</svg>
