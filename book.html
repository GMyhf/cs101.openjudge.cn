<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/theme.css">
<script>(function(){try{var t=localStorage.getItem('cs101-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='light';}})();</script>
<title>__BOOK_NAME__ · CS101 题库</title>
<style>
  /* 这一页刻意只有一张表。版式对着 http://cs101.openjudge.cn/pctbook/ 抄：
     面包屑 + 三个标签页 + 一张表 + 一条页码。颜色一律走 theme.css 的变量。 */
  * { box-sizing:border-box }
  body { margin:0; padding:0 0 60px; background:var(--bg); color:var(--ink); font:var(--font-ui) }
  .wrap { max-width:980px; margin:0 auto; padding:0 24px }
  .head { padding:28px 0 0 }
  .crumb { font-size:13px; color:var(--muted); text-decoration:none }
  .crumb:hover { color:var(--accent) }
  h1 { font-size:26px; margin:10px 0 3px }
  .sub { color:var(--muted); font-size:13px; margin:0 0 16px }
  .tabs { display:flex; gap:26px; border-bottom:1px solid var(--line) }
  .tabs a { display:block; padding:10px 1px; color:var(--muted); font-weight:600; text-decoration:none;
            border-bottom:2px solid transparent; margin-bottom:-1px }
  .tabs a:hover { color:var(--ink) }
  .tabs a.on { color:var(--ink); border-color:var(--accent) }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0 8px }
  .bar input { width:min(280px,55%); padding:7px 10px; border:1px solid var(--line); border-radius:var(--radius-sm);
               background:var(--panel); color:var(--ink); font:inherit; outline:none }
  .bar input:focus { border-color:var(--accent) }
  .status-filter { display:flex; align-items:end; gap:10px; flex-wrap:wrap; padding:14px 0 8px }
  .status-filter label { display:grid; gap:4px; color:var(--muted); font-size:12px }
  .status-filter input { width:180px; padding:7px 10px; border:1px solid var(--line);
                         border-radius:var(--radius-sm); background:var(--panel); color:var(--ink);
                         font:14px var(--font-ui); outline:none }
  .status-filter input:focus { border-color:var(--accent) }
  .status-filter button { padding:8px 15px; border:1px solid var(--accent); border-radius:var(--radius-sm);
                          background:var(--accent); color:white; font:600 13px var(--font-ui); cursor:pointer }
  .status-filter .clear { padding:7px 4px; color:var(--muted); font-size:13px; text-decoration:none }
  .status-results table { min-width:900px }
  .status-results th, .status-results td { white-space:nowrap }
  .table-wrap { overflow-x:auto }
  table { min-width:600px }
  th.sortable { cursor:pointer; user-select:none; white-space:nowrap }
  th.sortable:hover, th.sortable:focus-visible { color:var(--ink) }
  th.sortable.on { color:var(--ink) }
  th .arrow { display:inline-block; width:12px; text-align:center }
  a.pid { color:var(--accent); text-decoration:none; font-weight:600 }
  a.pid:hover { text-decoration:underline }
  td.title a { color:inherit; text-decoration:none }
  td.title a:hover { color:var(--accent); text-decoration:underline }
  .pages { display:flex; justify-content:center; gap:6px; flex-wrap:wrap; padding:18px 0 0 }
  .pages button { min-width:32px; padding:5px 9px; border:1px solid var(--line); border-radius:var(--radius-sm);
                  background:var(--panel); color:var(--ink); font:inherit; font-size:13px; cursor:pointer }
  .pages button.on { border-color:var(--accent); color:var(--accent); font-weight:650 }
  .pages button:disabled { opacity:.45; cursor:default }
  .note { padding:44px 0; text-align:center; color:var(--muted) }
  .note a { color:var(--accent) }
  .verdict-link { text-decoration:none }
  .verdict-head { display:flex; align-items:center; gap:12px; padding:20px 0 12px; font-size:17px }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding-bottom:6px }
  .block { padding:20px 0 0; border-top:1px solid var(--line); margin-top:18px }
  .block h2 { font-size:15px; margin:0 0 10px; color:var(--muted); font-weight:650 }
  .block div { margin-bottom:6px }
  pre.src { margin:8px 0 0; padding:11px 13px; border:1px solid var(--line); border-radius:var(--radius-sm);
            background:var(--soft); overflow:auto; max-height:420px;
            font:var(--code-size)/1.55 var(--font-mono); white-space:pre }
  .source-wrap { position:relative }
  .copy-code { position:absolute; top:8px; right:8px; width:28px; height:28px; padding:0; border:1px solid var(--line);
               border-radius:4px; background:var(--panel); color:var(--muted); cursor:pointer }
  .copy-code::before, .copy-code::after { content:''; position:absolute; width:9px; height:11px; border:1.5px solid currentColor; border-radius:1px }
  .copy-code::before { top:7px; left:9px }
  .copy-code::after { top:5px; left:7px; background:var(--panel) }
  .copy-code:hover, .copy-code:focus-visible, .copy-code.copied { border-color:var(--accent); color:var(--accent) }
  .copy-tip { position:absolute; top:42px; right:8px; z-index:1; padding:4px 7px; border-radius:4px; background:var(--ink); color:var(--bg);
              font:12px var(--font-ui); white-space:nowrap; opacity:0; transform:translateY(-3px); pointer-events:none; transition:opacity .12s,transform .12s }
  .copy-code:hover + .copy-tip, .copy-code:focus-visible + .copy-tip, .copy-code.show-tip + .copy-tip { opacity:1; transform:translateY(0) }
  .t-com { color:var(--tok-com); font-style:italic }
  .t-str { color:var(--tok-str) }
  .t-num { color:var(--tok-num) }
  .t-kw { color:var(--tok-kw); font-weight:600 }
  .t-pre { color:var(--tok-pre) }
  @media (max-width:620px) {
    .wrap { padding:0 14px }
    .tabs { gap:18px }
    h1 { font-size:22px }
  }
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="/"><span class="mark">CS</span><span>CS101 题库</span></a><nav class="topnav"><a href="/problems/">题库目录</a><a href="/history/">提交记录</a><a href="/help/">说明</a><button id="theme" type="button" class="ghost">深色</button><a id="account" href="/auth/login/">登录</a></nav></header>

<div class="wrap">
  <div class="head">
    <a class="crumb" href="/">CS101</a>
    <h1>__BOOK_NAME__</h1>
    <p class="sub" id="sub">正在读取…</p>
    <nav class="tabs">
      <a id="tab-problems" href="/book/__BOOK__/">题目</a>
      <a id="tab-ranking"  href="/book/__BOOK__/ranking/">排名</a>
      <a id="tab-status"   href="/book/__BOOK__/status/">状态</a>
    </nav>
  </div>
  <div id="view"><p class="note">正在读取…</p></div>
</div>

<script>
const BOOK = __BOOK_JSON__, VIEW = __VIEW_JSON__, SUBJECT = __SUBJECT_JSON__;
const view = document.querySelector('#view'), sub = document.querySelector('#sub');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LANGS = {python:'Python3', pypy3:'PyPy3', cpp:'G++', c:'GCC', csharp:'C#', fsharp:'F#',
               vbnet:'VB.NET', swift:'Swift', objc:'Objective-C'};
const PAGE_SIZE = 100;
// catalog 里的标题带着「E01003:」前缀（首页和 /problems/ 都这么剥）。
// 上游那一页的标题列只有 Hangover，这里跟它一致。
const titleOf = p => (p.title || p.id).replace(new RegExp('^' + p.id + '\\s*[:：]\\s*', 'i'), '') || p.id;
// 通过/尝试人数点进去是这道题的统计页（按题过滤的提交记录）。谁能看到什么由
// /api/submissions 定：列表人人可见，代码和判题详情只有本人和管理员拿得到。
// 0 不做成链接 —— 一个点进去必然是空表的链接，只会让人以为出了错。
const statsLink = (p, count) => count
  ? `<a class="pid" href="/history/?book=${encodeURIComponent(BOOK)}&problem=${encodeURIComponent(p.id)}">${count}</a>`
  : '—';
// 用户页和提交详情页没有自己的标签，各自高亮把人送过来的那一个。
const TAB_OF = {problems:'problems', ranking:'ranking', status:'status',
                user:'ranking', solution:'status'};
document.querySelector('#tab-' + TAB_OF[VIEW]).classList.add('on');
const userLink = (name, label = name) =>
  `<a class="pid" href="/history/?user=${encodeURIComponent(name)}">${esc(label)}</a>`;
// 用户页和提交详情页的标签条高亮的是「排名 / 状态」，但那两个标签指向的是题库根，
// 所以标题下面再给一条回题库的路，人不至于只能靠浏览器后退。
const bookLink = name => `<a class="pid" href="/book/${encodeURIComponent(BOOK)}/">${esc(name)}</a>`;

function table(headers, rows, sort) {
  return '<div class="table-wrap"><table><thead><tr>'
    + headers.map(h => {
        if (!h.key) return `<th class="${h.num ? 'num' : ''}">${h.text}</th>`;
        const on = sort && sort.key === h.key;
        return `<th class="${h.num ? 'num ' : ''}sortable${on ? ' on' : ''}"`
          + ` data-key="${h.key}" tabindex="0" role="button"`
          + ` aria-sort="${on ? (sort.dir < 0 ? 'descending' : 'ascending') : 'none'}">`
          + `${h.text}<span class="arrow">${on ? (sort.dir < 0 ? '↓' : '↑') : ''}</span></th>`;
      }).join('')
    + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
}

// 排序键。通过率在数据里是 "80%" 这种字符串，直接比字符串会把 "9%" 排在 "80%" 后面，
// 所以取回它的数值；没有提交过的题（空串）压到最后，而不是当成 0% 混进真实的 0%。
function sortValue(item, key) {
  if (key === 'id') return String(item.id || '');
  if (key === 'pass_rate') {
    const percent = parseFloat(item.pass_rate);
    return Number.isNaN(percent) ? -1 : percent;
  }
  return Number(item[key] || 0);
}

// 排序本身。**稳定排序**：JS 的 sort 按规范是稳定的，所以数值相同的行
// 仍然保持传进来的顺序（题号升序）—— 全库大部分题通过人数都是 0，
// 没有这条它们的相对次序会随实现漂移，看起来像每次刷新都在乱跳。
function sortProblems(items, sort) {
  const rows = items.slice();
  rows.sort((a, b) => {
    const left = sortValue(a, sort.key), right = sortValue(b, sort.key);
    if (left === right) return 0;
    return (left < right ? -1 : 1) * sort.dir;
  });
  return rows;
}
function badge(result) {
  const kind = result === 'Accepted' ? 'b-ac' : result === 'Wrong Answer' ? 'b-wa' : 'b-other';
  return `<span class="badge ${kind}">${esc(result || '—')}</span>`;
}
function note(html) { view.innerHTML = `<p class="note">${html}</p>`; }
function loginNote(what) {
  note(`登录后可查看本题库的${what}。<a href="/auth/login/">去登录</a>`);
}

// 提交页和详情页共用同一套颜色，但详情页不载入编辑器；在这里按提交语言做轻量扫描。
// token 自身和普通文本都经 esc 转义，提交源码不能借高亮变成 HTML。
const PY_KW = 'False|None|True|and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield';
const C_KW = 'auto|bool|break|case|char|class|const|constexpr|continue|default|delete|do|double|else|enum|extern|false|float|for|goto|if|inline|int|long|namespace|new|nullptr|operator|private|protected|public|return|short|signed|sizeof|static|struct|switch|template|this|throw|true|try|typedef|typename|union|unsigned|using|virtual|void|volatile|while';
const VB_KW = 'And|As|Boolean|ByRef|ByVal|Case|Class|Const|Continue|Dim|Do|Double|Each|Else|ElseIf|End|Exit|False|For|Function|If|In|Integer|Is|Loop|Module|New|Next|Not|Nothing|Or|Private|Public|Return|Select|Shared|Single|String|Sub|Then|To|True|Until|While';
const NUMBER = /\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b/y;
const SOURCE_SPECS = {
  python: [['com', /#[^\n]*/y], ['str', /(["]{3}|''')[\s\S]*?\1|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/y], ['num', NUMBER], ['kw', new RegExp('\\b(?:' + PY_KW + ')\\b', 'y')]],
  c: [['com', /\/\/[^\n]*|\/\*[\s\S]*?\*\//y], ['pre', /#[a-z]+/iy], ['str', /"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/y], ['num', NUMBER], ['kw', new RegExp('\\b(?:' + C_KW + ')\\b', 'y')]],
  vbnet: [['com', /'[^\n]*/y], ['str', /"(?:""|[^"\n])*"/y], ['num', NUMBER], ['kw', new RegExp('\\b(?:' + VB_KW + ')\\b', 'iy')]],
};
SOURCE_SPECS.pypy3 = SOURCE_SPECS.python;
for (const language of ['cpp', 'csharp', 'fsharp', 'swift', 'objc']) SOURCE_SPECS[language] = SOURCE_SPECS.c;

function highlightSource(code, language) {
  const specs = SOURCE_SPECS[language] || SOURCE_SPECS.c;
  let output = '', index = 0;
  while (index < code.length) {
    let token = null;
    for (const [kind, pattern] of specs) {
      pattern.lastIndex = index;
      const match = pattern.exec(code);
      if (match && match.index === index && match[0]) { token = [kind, match[0]]; break; }
    }
    if (token) {
      output += `<span class="t-${token[0]}">${esc(token[1])}</span>`;
      index += token[1].length;
    } else {
      output += esc(code[index++]);
    }
  }
  return output;
}

async function copySource(button) {
  const source = button.closest('.code-block').querySelector('code').textContent;
  const tip = button.nextElementSibling;
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(source);
    else {
      const box = document.createElement('textarea');
      box.value = source; box.style.position = 'fixed'; box.style.opacity = '0';
      document.body.appendChild(box); box.select(); document.execCommand('copy'); box.remove();
    }
    button.classList.add('copied', 'show-tip'); tip.textContent = '已复制';
  } catch (error) {
    button.classList.add('show-tip'); tip.textContent = '复制失败';
  }
  clearTimeout(button.copyTipTimer);
  button.copyTipTimer = setTimeout(() => { button.classList.remove('copied', 'show-tip'); tip.textContent = '复制代码'; }, 1400);
}

const statusQuery = VIEW === 'status' ? location.search : '';
const ENDPOINT = VIEW === 'user'
  ? `/api/books/${encodeURIComponent(BOOK)}/user/${encodeURIComponent(SUBJECT)}/`
  : VIEW === 'solution'
  ? `/api/books/${encodeURIComponent(BOOK)}/solution/${encodeURIComponent(SUBJECT)}/`
  : `/api/books/${encodeURIComponent(BOOK)}/${statusQuery}`;

fetch(ENDPOINT, { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(render)
  .catch(status => {
    sub.textContent = '';
    if (status === 401) return loginNote(VIEW === 'solution' ? '提交详情' : '这个页面');
    if (status === 404) return note(VIEW === 'solution' ? '找不到这次提交。' : '这个用户在本题库没有提交记录。');
    note('题库暂时不可用。');
  });

function render(data) {
  if (VIEW === 'user') return renderUser(data);
  if (VIEW === 'solution') return renderSolution(data);
  sub.textContent = `${data.problem_count} 道题目 · ${data.tested_count} 道可在本站判题`;
  if (VIEW === 'problems') return renderProblems(data);
  if (!data.authenticated) return loginNote(VIEW === 'ranking' ? '排名' : '提交状态');
  if (VIEW === 'ranking') return renderRanking(data);
  return renderStatus(data);
}

function renderProblems(data) {
  view.innerHTML = `<div class="bar"><span class="muted" id="count"></span>
    <input id="q" type="search" placeholder="搜索题号或标题" autocomplete="off"></div>
    <div id="rows"></div><div class="pages" id="pager"></div>`;
  const q = document.querySelector('#q'), rows = document.querySelector('#rows'),
        pager = document.querySelector('#pager'), count = document.querySelector('#count');
  let page = 1;
  // 默认按通过人数从多到少。人拍板的：这一页是拿来挑题的，
  // 「多少人做出来了」比题号更能说明这道题值不值得先做。点表头可以改。
  let sort = { key: 'accepted_count', dir: -1 };
  const draw = () => {
    const term = q.value.trim().toLowerCase();
    const hits = sortProblems(data.problems.filter(p => !term
      || p.id.toLowerCase().includes(term) || (p.title || '').toLowerCase().includes(term)), sort);
    const pages = Math.max(1, Math.ceil(hits.length / PAGE_SIZE));
    page = Math.min(page, pages);
    count.textContent = `${hits.length} 题`;
    rows.innerHTML = hits.length ? table(
      [{text:'题目ID', key:'id'}, {text:'标题'}, {text:'通过率', num:true, key:'pass_rate'},
       {text:'通过人数', num:true, key:'accepted_count'}, {text:'尝试人数', num:true, key:'attempt_count'}],
      hits.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE).map(p => `<tr>
        <td class="num"><a class="pid" href="${esc(p.path)}">${esc(p.id)}</a></td>
        <td class="title"><a href="${esc(p.path)}">${esc(titleOf(p))}</a>${
          p.test_count ? '' : ' <span class="badge b-info">暂无数据</span>'}</td>
        <td class="num">${esc(p.pass_rate || '—')}</td>
        <td class="num">${statsLink(p, p.accepted_count)}</td>
        <td class="num">${statsLink(p, p.attempt_count)}</td></tr>`), sort)
      : '<p class="note">没有匹配的题目。</p>';
    // 页码按钮：题目最多的题库也就 10 页，全列出来比「上一页/下一页」少点两次。
    pager.innerHTML = pages > 1 ? Array.from({length: pages}, (_, i) =>
      `<button type="button" data-page="${i + 1}" class="${i + 1 === page ? 'on' : ''}">${i + 1}</button>`).join('') : '';
  };
  q.addEventListener('input', () => { page = 1; draw(); });
  pager.addEventListener('click', event => {
    const target = event.target.closest('button[data-page]');
    if (target) { page = Number(target.dataset.page); draw(); scrollTo(0, 0); }
  });
  // 点表头换排序：同一列再点一次翻方向。题号默认升序，几个数值列默认降序 ——
  // 「谁最多」几乎总是先想看的那一头。
  const resort = target => {
    if (!target) return;
    const key = target.dataset.key;
    sort = sort.key === key ? { key, dir: -sort.dir } : { key, dir: key === 'id' ? 1 : -1 };
    page = 1;
    draw();
  };
  rows.addEventListener('click', event => resort(event.target.closest('th[data-key]')));
  rows.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const target = event.target.closest('th[data-key]');
    if (target) { event.preventDefault(); resort(target); }
  });
  draw();
}

function renderRanking(data) {
  if (!data.ranking.length) return note('这个题库还没有提交记录。');
  view.innerHTML = table(
    [{text:'排名', num:true}, {text:'名字'}, {text:'通过题数', num:true},
     {text:'提交次数', num:true}, {text:'最近提交'}],
    data.ranking.map((r, i) => `<tr>
      <td class="num">${i + 1}</td>
      <td>${userLink(r.user, r.name)}</td>
      <td class="num">${r.solved}</td>
      <td class="num">${r.submissions}</td>
      <td class="num muted">${esc(r.last_submit || '—')}</td></tr>`));
}

function renderStatus(data) {
  const filters = data.filters || {};
  const action = `/book/${encodeURIComponent(BOOK)}/status/`;
  const form = `<form class="status-filter" method="get" action="${action}">
    <label>题目ID<input name="problem" value="${esc(filters.problem || '')}" autocomplete="off"></label>
    <label>昵称<input name="name" value="${esc(filters.name || '')}" autocomplete="off"></label>
    <button type="submit">查询</button>
    ${(filters.problem || filters.name) ? `<a class="clear" href="${action}">清除</a>` : ''}
  </form>`;
  if (!data.status.length) {
    view.innerHTML = form + '<p class="note">没有匹配的提交记录。</p>';
    return;
  }
  view.innerHTML = form + `<div class="bar"><span class="muted">最近 ${data.status.length} 次提交</span></div><div class="status-results">` + table(
    [{text:'提交人'}, {text:'题目'}, {text:'结果'}, {text:'内存', num:true},
     {text:'时间', num:true}, {text:'代码长度', num:true}, {text:'语言'}, {text:'提交时间'}],
    data.status.map(s => `<tr>
      <td>${userLink(s.user, s.name)}</td>
      <td><a class="pid" href="/${encodeURIComponent(BOOK)}/${encodeURIComponent(s.problem)}/">${esc(s.problem)}:${esc(titleOf({id:s.problem, title:s.title}))}</a></td>
      <td><a class="verdict-link" href="/book/${encodeURIComponent(BOOK)}/solution/${encodeURIComponent(s.id)}/">${badge(s.result)}</a></td>
      <td class="num">${s.memory_kb == null ? '—' : s.memory_kb + ' kB'}</td>
      <td class="num">${s.time_ms == null ? '—' : s.time_ms + ' ms'}</td>
      <td class="num">${s.source_bytes == null ? '—' : s.source_bytes + ' B'}</td>
      <td class="muted">${esc(LANGS[s.language] || s.language || '—')}</td>
      <td class="num muted">${esc(s.created)}</td></tr>`)) + '</div>';
}

function renderUser(data) {
  sub.innerHTML = `${bookLink(data.name)} · 通过 <b>${data.solved}</b> / 尝试 <b>${data.attempted}</b> 题`
    + ` · 共 <b>${data.submissions}</b> 次提交`;
  document.querySelector('h1').textContent = data.user;
  document.title = data.user + ' · ' + data.name + ' · CS101 题库';
  if (!data.problems.length) return note('这个用户在本题库还没有提交记录。');
  view.innerHTML = table(
    [{text:'题目ID'}, {text:'标题'}, {text:'结果'}, {text:'提交次数', num:true},
     {text:'首次通过'}, {text:'最近提交'}],
    data.problems.map(p => `<tr>
      <td class="num"><a class="pid" href="${esc(p.path || '/' + BOOK + '/' + p.id + '/')}">${esc(p.id)}</a></td>
      <td class="title"><a href="${esc(p.path || '/' + BOOK + '/' + p.id + '/')}">${esc(titleOf(p))}</a></td>
      <td>${badge(p.result)}</td>
      <td class="num"><a class="pid" href="/history/?book=${encodeURIComponent(BOOK)}&problem=${encodeURIComponent(p.id)}">${p.attempts}</a></td>
      <td class="num muted">${esc(p.accepted_at || '—')}</td>
      <td class="num muted">${esc(p.last_submit || '—')}</td></tr>`));
}

function renderSolution(data) {
  sub.innerHTML = `${bookLink(data.name)} · <a class="pid" href="${esc(data.path || '/' + BOOK + '/' + data.problem + '/')}">`
    + `${esc(data.problem)} ${esc(titleOf({id: data.problem, title: data.title}))}</a>`
    + ` · 提交人 ${userLink(data.user)}`;
  document.querySelector('h1').textContent = '提交 #' + data.id;
  document.title = '提交 #' + data.id + ' · ' + data.name + ' · CS101 题库';
  const chip = (label, value) => value == null || value === ''
    ? '' : `<span class="chip">${label}<b>${esc(value)}</b></span>`;
  const blocks = [
    `<div class="verdict-head">${badge(data.result)}<span class="muted">${esc(data.created)}</span></div>`,
    '<div class="chips">'
      + chip('用时', data.time_ms == null ? '' : data.time_ms + ' ms')
      + chip('内存', data.memory_kb == null ? '' : data.memory_kb + ' kB')
      + chip('代码长度', data.source_bytes == null ? '' : data.source_bytes + ' B')
      + chip('语言', data.language_version || LANGS[data.language] || data.language)
      + '</div>',
  ];
  if (!data.mine) {
    // 老规则：别人的代码和判题详情看不到。这里把「看不到」明说出来，
    // 而不是渲染成一片空白 —— 空白会被当成「这次提交没有代码」。
    blocks.push('<p class="note">只有本人和管理员能看到这次提交的代码与判题详情。</p>');
  } else {
    const d = data.detail || {};
    const lines = [];
    if (d.case !== undefined) lines.push(`<div><b>出错的数据组：</b>第 ${esc(d.case)} 组</div>`);
    if (d.cases !== undefined) lines.push(`<div><b>通过用例：</b>${esc(d.cases)} 组全部通过</div>`);
    if (d.expected_tokens !== undefined)
      lines.push(`<div><b>输出规模：</b>期望 ${esc(d.expected_tokens)} 个 token，实际 ${esc(d.actual_tokens)} 个</div>`);
    if (d.message) lines.push(`<pre class="src">${esc(d.message)}</pre>`);
    if (d.failing_input) lines.push(`<div><b>出错那组的输入：</b></div><pre class="src">${esc(d.failing_input.text || '')}</pre>`);
    if (d.expected_output) lines.push(`<div><b>期望输出：</b></div><pre class="src">${esc(d.expected_output.text || '')}</pre>`);
    if (lines.length) blocks.push('<section class="block"><h2>判题详情</h2>' + lines.join('') + '</section>');
    const source = data.source || '（这次提交没有留下代码）';
    blocks.push('<section class="block code-block"><h2>代码</h2><div class="source-wrap"><button class="copy-code" type="button" aria-label="复制代码" onclick="copySource(this)"></button><span class="copy-tip" role="status">复制代码</span>'
      + `<pre class="src code"><code>${highlightSource(source, data.language)}</code></pre></div></section>`);
  }
  view.innerHTML = blocks.join('');
}
</script>
<script>const themeBtn=document.querySelector('#theme');function applyTheme(n){document.documentElement.dataset.theme=n;themeBtn.textContent=n==='dark'?'浅色':'深色';try{localStorage.setItem('cs101-theme',n)}catch(e){}}applyTheme(document.documentElement.dataset.theme==='dark'?'dark':'light');themeBtn.onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(d.authenticated){account.textContent=d.user;account.href='/history/?mine=1'}}).catch(()=>{});</script>
</body>
