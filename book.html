<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__BOOK_NAME__ · CS101 题库</title>
  <link rel="stylesheet" href="/static/theme.css">
  <script>(function(){try{var t=localStorage.getItem('cs101-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}})();</script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1040px;margin:auto;padding:0 24px}.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:750;text-decoration:none}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:14px}.topnav{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:14px}.topnav a,.topnav button{color:inherit;text-decoration:none;background:transparent;border:0;font:inherit;cursor:pointer;padding:0}.topnav a:hover,.topnav button:hover{color:var(--green)}.head{padding:34px 0 22px}.crumb{font-size:13px;color:var(--muted);text-decoration:none}.crumb:hover{color:var(--green)}h1{margin:12px 0 2px;font-size:30px;line-height:1.2}.meta{margin:0;color:var(--muted);font-size:14px}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}.tabs a{display:block;padding:11px 1px 10px;color:var(--muted);font-weight:650;text-decoration:none;border-bottom:2px solid transparent}.tabs a:hover{color:var(--green)}.tabs a.active{color:var(--ink);border-color:var(--green)}main{padding:22px 0 60px}.toolbar{display:flex;justify-content:space-between;gap:14px;margin-bottom:15px}.toolbar input{width:min(370px,100%);padding:9px 11px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font:inherit;outline:none}.toolbar input:focus{border-color:var(--green)}.muted{color:var(--muted);font-size:13px}.table-wrap{overflow:auto;border-top:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px;font-weight:650}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.problem-id{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--green)}.problem-title{color:var(--ink);text-decoration:none;font-weight:600}.problem-title:hover{color:var(--green);text-decoration:underline}.verdict{font-weight:650}.verdict.Accepted{color:var(--green)}.empty{padding:36px 0;text-align:center;color:var(--muted)}@media(max-width:620px){.shell{padding:0 16px}.topbar{height:58px}.topnav a:nth-child(2){display:none}.head{padding-top:27px}.tabs{gap:19px}h1{font-size:25px}.toolbar{display:block}.toolbar input{width:100%;margin-bottom:8px}}
  </style>
</head>
<body>
  <header class="shell topbar"><a class="brand" href="/"><span class="mark">CS</span><span>CS101 题库</span></a><nav class="topnav"><a href="/problems/">题库目录</a><a href="/history/">提交记录</a><button id="theme" type="button">深色</button></nav></header>
  <section class="shell head"><a class="crumb" href="/problems/">题库目录</a><h1 id="bookName">__BOOK_NAME__</h1><p class="meta" id="bookMeta">正在读取题库…</p><nav class="tabs"><a id="problemsTab" href="/__BOOK__/">题目</a><a id="rankingTab" href="/__BOOK__/ranking/">排名</a><a id="statusTab" href="/__BOOK__/status/">状态</a></nav></section>
  <main class="shell"><div id="content" class="empty">正在读取…</div></main>
  <script>
    const BOOK=__BOOK_JSON__, view=location.pathname.includes('/ranking/')?'ranking':location.pathname.includes('/status/')?'status':'problems';
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    $('#'+view+'Tab').classList.add('active');
    $('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem('cs101-theme',dark?'light':'dark');$('#theme').textContent=dark?'深色':'浅色'};
    function table(headers, rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th class="'+(h.num?'num':'')+'">'+h.text+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
    fetch('/api/books/'+encodeURIComponent(BOOK)+'/').then(r=>r.ok?r.json():Promise.reject()).then(data=>{
      $('#bookName').textContent=data.name;$('#bookMeta').textContent=data.problem_count+' 道题目';
      const content=$('#content');
      if(view==='problems'){
        content.innerHTML='<div class="toolbar"><input id="search" type="search" placeholder="搜索题号或标题" autocomplete="off"><span class="muted">'+data.problem_count+' 题</span></div><div id="rows"></div>';
        const render=()=>{const q=$('#search').value.trim().toLowerCase(), items=data.problems.filter(p=>!q||p.id.toLowerCase().includes(q)||p.title.toLowerCase().includes(q));$('#rows').innerHTML=items.length?table([{text:'题号'},{text:'标题'},{text:'测试数据',num:true},{text:'通过 / 提交',num:true}],items.map(p=>'<tr><td class="problem-id">'+esc(p.id)+'</td><td><a class="problem-title" href="/'+encodeURIComponent(BOOK)+'/'+encodeURIComponent(p.id)+'/">'+esc(p.title)+'</a></td><td class="num">'+p.test_count+'</td><td class="num">'+p.accepted_count+' / '+p.attempt_count+'</td></tr>').join('')):'<div class="empty">没有匹配的题目。</div>'};$('#search').oninput=render;render();
      }else if(view==='ranking'){
        content.innerHTML=data.ranking.length?table([{text:'排名',num:true},{text:'用户'},{text:'已解',num:true},{text:'提交',num:true},{text:'最近提交'}],data.ranking.map((r,i)=>'<tr><td class="num">'+(i+1)+'</td><td>'+esc(r.user)+'</td><td class="num">'+r.solved+'</td><td class="num">'+r.submissions+'</td><td>'+esc(r.last_submit||'—')+'</td></tr>').join('')):'<div class="empty">这个题库还没有提交记录。</div>';
      }else{
        content.innerHTML=data.status.length?table([{text:'提交时间'},{text:'用户'},{text:'题号'},{text:'结果'}],data.status.map(s=>'<tr><td>'+esc(s.created)+'</td><td>'+esc(s.user)+'</td><td><a class="problem-id" href="/'+encodeURIComponent(BOOK)+'/'+encodeURIComponent(s.problem)+'/">'+esc(s.problem)+'</a></td><td class="verdict '+esc(s.result)+'">'+esc(s.result)+'</td></tr>').join('')):'<div class="empty">这个题库还没有提交记录。</div>';
      }
    }).catch(()=>$('#content').textContent='题库暂时不可用。');
  </script>
</body>
</html>
