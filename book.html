<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__BOOK_NAME__ · CS101 题库</title>
  <link rel="stylesheet" href="/static/theme.css">
  <script>(function(){try{var t=localStorage.getItem('cs101-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}})();</script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:960px;margin:auto;padding:0 20px}.topbar{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:750;text-decoration:none}.mark{display:grid;place-items:center;width:27px;height:27px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:12px}.topnav{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:13px}.topnav a,.topnav button{color:inherit;text-decoration:none;background:transparent;border:0;font:inherit;cursor:pointer;padding:0}.topnav a:hover,.topnav button:hover{color:var(--green)}.head{padding:18px 0 0}.course{display:flex;align-items:baseline;gap:9px;padding:0 0 15px}.course a{color:var(--green);font-size:18px;font-weight:750;text-decoration:none}.course .slash{color:var(--muted);font-size:18px}.course h1{margin:0;font-size:18px;line-height:1.25}.meta{margin-left:auto;color:var(--muted);font-size:12px}.tabs{display:flex;gap:0;border-bottom:3px solid var(--green)}.tabs a{display:block;padding:8px 17px;color:var(--muted);font-weight:650;text-decoration:none;border:1px solid transparent;border-bottom:0}.tabs a:hover{color:var(--green);background:var(--accent-soft)}.tabs a.active{background:var(--green);border-color:var(--green);color:var(--bg)}main{padding:17px 0 52px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 9px}.toolbar input{width:270px;max-width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink);font:inherit;outline:none}.toolbar input:focus{border-color:var(--green)}.muted{color:var(--muted);font-size:12px}.table-wrap{overflow:auto;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:600px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--soft);color:var(--muted);font-size:12px;font-weight:700}tbody tr:nth-child(even){background:var(--soft)}tbody tr:hover{background:var(--accent-soft)}tbody tr:last-child td{border-bottom:0}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.problem-id{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--green)}.problem-title{color:var(--ink);text-decoration:none}.problem-title:hover,.problem-id:hover{color:var(--green);text-decoration:underline}.verdict{font-weight:650}.verdict.Accepted{color:var(--green)}.pagination{display:flex;justify-content:flex-end;gap:4px;margin:12px 0}.pagination button{min-width:29px;padding:4px 7px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}.pagination button:hover{border-color:var(--green);color:var(--green)}.pagination button.current{background:var(--green);border-color:var(--green);color:var(--bg)}.empty{padding:30px 0;text-align:center;color:var(--muted)}@media(max-width:620px){.shell{padding:0 14px}.topbar{height:48px}.topnav a:nth-child(2){display:none}.head{padding-top:14px}.course{padding-bottom:12px}.course h1{font-size:16px}.course .meta{display:none}.tabs a{padding:8px 13px}.toolbar{display:block}.toolbar input{width:100%;margin-bottom:7px}.pagination{justify-content:center}}
  </style>
</head>
<body>
  <header class="shell topbar"><a class="brand" href="/"><span class="mark">CS</span><span>CS101 题库</span></a><nav class="topnav"><a href="/problems/">题库目录</a><a href="/history/">提交记录</a><button id="theme" type="button">深色</button></nav></header>
  <section class="shell head"><div class="course"><a href="/">CS101</a><span class="slash">/</span><h1 id="bookName">__BOOK_NAME__</h1><span class="meta" id="bookMeta">正在读取题库…</span></div><nav class="tabs"><a id="problemsTab" href="/__BOOK__/">题目</a><a id="rankingTab" href="/__BOOK__/ranking/">排名</a><a id="statusTab" href="/__BOOK__/status/">状态</a></nav></section>
  <main class="shell"><div id="content" class="empty">正在读取…</div></main>
  <script>
    const BOOK=__BOOK_JSON__, view=location.pathname.includes('/ranking/')?'ranking':location.pathname.includes('/status/')?'status':'problems';
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    $('#'+view+'Tab').classList.add('active');
    $('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem('cs101-theme',dark?'light':'dark');$('#theme').textContent=dark?'深色':'浅色'};
    function table(headers, rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th class="'+(h.num?'num':'')+'">'+h.text+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
    fetch('/api/books/'+encodeURIComponent(BOOK)+'/').then(r=>r.ok?r.json():Promise.reject()).then(data=>{
      $('#bookName').textContent=data.name;$('#bookMeta').textContent=data.problem_count+' 道题目';
      const content=$('#content');
      if(view==='problems'){
        content.innerHTML='<div class="toolbar"><input id="search" type="search" placeholder="搜索题号或标题" autocomplete="off"><span class="muted">'+data.problem_count+' 题</span></div><div id="rows"></div>';
        let page=0;const render=()=>{const q=$('#search').value.trim().toLowerCase(),items=data.problems.filter(p=>!q||p.id.toLowerCase().includes(q)||p.title.toLowerCase().includes(q)),pages=Math.ceil(items.length/50);page=Math.min(page,Math.max(0,pages-1));const slice=items.slice(page*50,(page+1)*50),nav=pages>1?'<nav class="pagination">'+Array.from({length:pages},(_,i)=>'<button type="button" class="'+(i===page?'current':'')+'" data-page="'+i+'">'+(i+1)+'</button>').join('')+'</nav>':'';$('#rows').innerHTML=items.length?table([{text:'题目ID'},{text:'标题'},{text:'测试数据',num:true},{text:'通过 / 提交',num:true}],slice.map(p=>'<tr><td><a class="problem-id" href="/'+encodeURIComponent(BOOK)+'/'+encodeURIComponent(p.id)+'/">'+esc(p.id)+'</a></td><td><a class="problem-title" href="/'+encodeURIComponent(BOOK)+'/'+encodeURIComponent(p.id)+'/">'+esc(p.title)+'</a></td><td class="num">'+p.test_count+'</td><td class="num">'+p.accepted_count+' / '+p.attempt_count+'</td></tr>').join(''))+nav:'<div class="empty">没有匹配的题目。</div>';document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{page=Number(button.dataset.page);render();window.scrollTo({top:0,behavior:'smooth'})})};$('#search').oninput=()=>{page=0;render()};render();
      }else if(view==='ranking'){
        content.innerHTML=data.ranking.length?table([{text:'排名',num:true},{text:'用户'},{text:'已解',num:true},{text:'提交',num:true},{text:'最近提交'}],data.ranking.map((r,i)=>'<tr><td class="num">'+(i+1)+'</td><td>'+esc(r.user)+'</td><td class="num">'+r.solved+'</td><td class="num">'+r.submissions+'</td><td>'+esc(r.last_submit||'—')+'</td></tr>').join('')):'<div class="empty">这个题库还没有提交记录。</div>';
      }else{
        content.innerHTML=data.status.length?table([{text:'提交时间'},{text:'用户'},{text:'题号'},{text:'结果'}],data.status.map(s=>'<tr><td>'+esc(s.created)+'</td><td>'+esc(s.user)+'</td><td><a class="problem-id" href="/'+encodeURIComponent(BOOK)+'/'+encodeURIComponent(s.problem)+'/">'+esc(s.problem)+'</a></td><td class="verdict '+esc(s.result)+'">'+esc(s.result)+'</td></tr>').join('')):'<div class="empty">这个题库还没有提交记录。</div>';
      }
    }).catch(()=>$('#content').textContent='题库暂时不可用。');
  </script>
</body>
</html>
