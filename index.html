<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CS101 题库</title>
  <style>
    :root{--ink:#16231d;--muted:#6c7b73;--line:#dfe7e1;--bg:#f4f7f4;--paper:#fff;--green:#237a50;--green-soft:#e5f3eb;--amber:#c87828;--shadow:0 18px 45px rgba(34,63,45,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    a{color:inherit}.shell{max-width:1180px;margin:auto;padding:0 24px}.top{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center;text-decoration:none;font-weight:750;letter-spacing:.02em}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--ink);color:white;font-size:16px}.topnav{display:flex;gap:20px;color:var(--muted);font-size:14px}.topnav a{text-decoration:none}.topnav a:hover{color:var(--green)}
    .hero{padding:54px 0 34px;background:var(--paper);border-bottom:1px solid var(--line)}.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:52px;align-items:end}.eyebrow{color:var(--green);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(36px,5vw,64px);line-height:1.05;letter-spacing:-.02em;margin:13px 0 16px;max-width:700px}.hero p{color:var(--muted);max-width:620px;margin:0;font-size:17px}.hero-note{border-left:3px solid var(--amber);padding:7px 0 7px 18px;color:var(--muted)}.hero-note strong{display:block;color:var(--ink);font-size:20px;margin-bottom:5px}.hero-note span{font-size:13px}
    .content{padding:30px 0 70px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px}.stat{background:var(--paper);border:1px solid var(--line);padding:18px 20px;border-radius:10px}.stat b{display:block;font-size:28px;line-height:1.1;margin-bottom:4px}.stat span{color:var(--muted);font-size:13px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}.section-head h2{font-size:22px;margin:0}.section-head p{color:var(--muted);margin:0;font-size:13px}.toolbar{display:flex;gap:10px;margin-bottom:16px}.toolbar input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font:inherit;outline:none}.toolbar input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}.toolbar a{white-space:nowrap;padding:11px 15px;border-radius:7px;background:var(--ink);color:#fff;text-decoration:none;font-weight:650}.catalog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.book-block{min-width:0}.book-title{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;padding-bottom:7px;border-bottom:2px solid var(--line);font-size:16px}.book-title span{font-size:12px;color:var(--muted);font-weight:400}.list{display:grid;gap:8px}.problem{display:flex;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:12px 14px;text-decoration:none;transition:transform .16s,border-color .16s,box-shadow .16s}.problem:hover{transform:translateY(-2px);border-color:#9ac7ac;box-shadow:var(--shadow)}.pid{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--green);min-width:62px}.problem-main{min-width:0;flex:1}.problem-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.problem-meta{display:block;color:var(--muted);font-size:12px;margin-top:2px}.arrow{color:var(--muted);font-size:18px}.empty{padding:32px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:9px}.footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding:22px 0 34px}
    @media(max-width:760px){.shell{padding:0 16px}.top{height:62px}.topnav{gap:12px}.hero{padding:40px 0 30px}.hero-grid{grid-template-columns:1fr;gap:24px}.hero h1{font-size:42px}.stats{gap:8px}.stat{padding:14px}.stat b{font-size:23px}.catalog-grid{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column;gap:3px}}
  </style>
</head>
<body>
  <header class="top shell"><a class="brand" href="/"><span class="mark">CS</span><span>CS101 题库</span></a><nav class="topnav"><a href="/problems/">全部题目</a><a href="/history/">提交记录</a><a href="/auth/login/" id="account">登录</a></nav></header>
  <main class="content shell"><div class="section-head"><div><h2>全部题库 <span>（1,863 收录题目，1,530 有测试数据）</span></h2><p>每个题库展示 5 道可直接判题的题目</p></div></div><div class="toolbar"><input id="search" type="search" placeholder="搜索题号或标题" autocomplete="off"><a href="/problems/">浏览完整目录 →</a></div><div id="list" class="catalog-grid"></div><div id="empty" class="empty" hidden>没有找到匹配题目。</div></main>
  <footer class="footer"><div class="shell">CS101 题库 · Python 3 / PyPy3 / C++17</div></footer>
  <script>
    const list=document.querySelector('#list'), empty=document.querySelector('#empty'), search=document.querySelector('#search'); let problems=[];
    const bookNames={pctbook:'计算思维算法实践',practice:'CS101 练习题',routine:'数算每日选做',dsapre:'数算预习题', '2025sp_routine':'数算 2025 Spring', '25dsapre':'数算 2025 Pre', '2024fallroutine':'数算 2024 Fall', '2024sp_routine':'数算 2024 Spring'};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    fetch('/api/catalog').then(r=>r.json()).then(data=>{problems=(data.problems||[]).filter(p=>(p.test_count||0)>=5);shuffle(problems);render();}).catch(()=>{empty.hidden=false;empty.textContent='题库暂时不可用';});
    fetch('/api/me').then(r=>r.json()).then(data=>{if(data.authenticated){const account=document.querySelector('#account');account.textContent=data.user;account.href='/account/';}}).catch(()=>{});
    function shuffle(items){for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}}
    function titleOf(p){return (p.title||'').replace(new RegExp('^'+p.id+'\\s*[:：]\\s*','i'),'')||p.id;}
    function render(){const q=search.value.trim().toLowerCase();const groups=new Map();for(const p of problems){if(q&&!p.id.toLowerCase().includes(q)&&!(p.title||'').toLowerCase().includes(q))continue;if(!groups.has(p.book))groups.set(p.book,[]);if(groups.get(p.book).length<5)groups.get(p.book).push(p);}list.innerHTML=[...groups].map(([book,items])=>`<section class="book-block"><h3 class="book-title">${esc(bookNames[book]||book)}<span>${items.length} 题</span></h3><div class="list">${items.map(p=>`<a class="problem" href="${esc(p.path)}"><span class="pid">${esc(p.id)}</span><span class="problem-main"><span class="problem-title">${esc(titleOf(p))}</span><span class="problem-meta">${p.test_count} 组测试数据</span></span><span class="arrow">›</span></a>`).join('')}</div></section>`).join('');empty.hidden=groups.size>0;}
    search.addEventListener('input',render);
  </script>
</body>
</html>
