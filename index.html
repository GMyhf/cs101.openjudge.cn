<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CS101 · 本地题库</title>
  <style>
    :root{--ink:#16231d;--muted:#6c7b73;--line:#dfe7e1;--bg:#f4f7f4;--paper:#fff;--green:#237a50;--green-soft:#e5f3eb;--amber:#c87828;--shadow:0 18px 45px rgba(34,63,45,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    a{color:inherit}.shell{max-width:1180px;margin:auto;padding:0 24px}.top{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center;text-decoration:none;font-weight:750;letter-spacing:.02em}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--ink);color:white;font-size:16px}.topnav{display:flex;gap:20px;color:var(--muted);font-size:14px}.topnav a{text-decoration:none}.topnav a:hover{color:var(--green)}
    .hero{padding:54px 0 34px;background:var(--paper);border-bottom:1px solid var(--line)}.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:52px;align-items:end}.eyebrow{color:var(--green);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(36px,5vw,64px);line-height:1.05;letter-spacing:-.02em;margin:13px 0 16px;max-width:700px}.hero p{color:var(--muted);max-width:620px;margin:0;font-size:17px}.hero-note{border-left:3px solid var(--amber);padding:7px 0 7px 18px;color:var(--muted)}.hero-note strong{display:block;color:var(--ink);font-size:20px;margin-bottom:5px}.hero-note span{font-size:13px}
    .content{padding:30px 0 70px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px}.stat{background:var(--paper);border:1px solid var(--line);padding:18px 20px;border-radius:10px}.stat b{display:block;font-size:28px;line-height:1.1;margin-bottom:4px}.stat span{color:var(--muted);font-size:13px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}.section-head h2{font-size:22px;margin:0}.section-head p{color:var(--muted);margin:0;font-size:13px}.toolbar{display:flex;gap:10px;margin-bottom:16px}.toolbar input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font:inherit;outline:none}.toolbar input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}.toolbar a{white-space:nowrap;padding:11px 15px;border-radius:7px;background:var(--ink);color:#fff;text-decoration:none;font-weight:650}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.problem{display:flex;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:15px 17px;text-decoration:none;transition:transform .16s,border-color .16s,box-shadow .16s}.problem:hover{transform:translateY(-2px);border-color:#9ac7ac;box-shadow:var(--shadow)}.pid{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--green);min-width:62px}.problem-main{min-width:0;flex:1}.problem-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.problem-meta{display:block;color:var(--muted);font-size:12px;margin-top:2px}.arrow{color:var(--muted);font-size:18px}.empty{padding:32px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:9px}.footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding:22px 0 34px}
    @media(max-width:760px){.shell{padding:0 16px}.top{height:62px}.topnav{gap:12px}.hero{padding:40px 0 30px}.hero-grid{grid-template-columns:1fr;gap:24px}.hero h1{font-size:42px}.stats{gap:8px}.stat{padding:14px}.stat b{font-size:23px}.list{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column;gap:3px}}
  </style>
</head>
<body>
  <header class="top shell"><a class="brand" href="/"><span class="mark">CS</span><span>CS101 本地题库</span></a><nav class="topnav"><a href="/problems/">全部题目</a><a href="/history/">提交记录</a><a href="/auth/login/" id="account">登录</a></nav></header>
  <section class="hero"><div class="shell hero-grid"><div><div class="eyebrow">Local practice workspace</div><h1>本地题库，随时开练。</h1><p>CS101 题库的本地镜像与判题工作台。打开一道题，阅读题面，直接提交代码并查看真实测试反馈。</p></div><div class="hero-note"><strong id="notice">正在读取题库…</strong><span>数据与判题服务均运行在当前主机</span></div></div></section>
  <main class="content shell"><div class="stats"><div class="stat"><b id="total">—</b><span>收录题目</span></div><div class="stat"><b id="ready">—</b><span>已有本地测试数据</span></div><div class="stat"><b id="cases">—</b><span>本地测试组数</span></div></div><div class="section-head"><div><h2>最近可练</h2><p>从本地测试数据中挑选题目开始</p></div></div><div class="toolbar"><input id="search" type="search" placeholder="搜索题号或标题" autocomplete="off"><a href="/problems/">浏览完整目录 →</a></div><div id="list" class="list"></div><div id="empty" class="empty" hidden>没有找到匹配题目。</div></main>
  <footer class="footer"><div class="shell">CS101 · 本地课程题库 · Python 3 / PyPy3 / C++17</div></footer>
  <script>
    const list=document.querySelector('#list'), empty=document.querySelector('#empty'), search=document.querySelector('#search'); let problems=[];
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    fetch('/api/catalog').then(r=>r.json()).then(data=>{problems=(data.problems||[]).filter(p=>(p.test_count||0)>0);const all=data.problems||[];document.querySelector('#total').textContent=all.length.toLocaleString();document.querySelector('#ready').textContent=problems.length.toLocaleString();document.querySelector('#cases').textContent=problems.reduce((n,p)=>n+(p.test_count||0),0).toLocaleString();render();}).catch(()=>{document.querySelector('#notice').textContent='题库暂时不可用';});
    fetch('/api/course').then(r=>r.json()).then(data=>{document.querySelector('#notice').textContent=data.course?.notice||'本地题库已就绪';}).catch(()=>{});
    fetch('/api/me').then(r=>r.json()).then(data=>{if(data.authenticated)document.querySelector('#account').textContent='已登录';}).catch(()=>{});
    function titleOf(p){return (p.title||'').replace(new RegExp('^'+p.id+'\\s*[:：]\\s*','i'),'')||p.id;}
    function render(){const q=search.value.trim().toLowerCase();const hits=problems.filter(p=>!q||p.id.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q)).slice(0,12);list.innerHTML=hits.map(p=>`<a class="problem" href="${esc(p.path)}"><span class="pid">${esc(p.id)}</span><span class="problem-main"><span class="problem-title">${esc(titleOf(p))}</span><span class="problem-meta">${esc(p.book)} · ${p.test_count} 组本地测试</span></span><span class="arrow">›</span></a>`).join('');empty.hidden=hits.length>0;}
    search.addEventListener('input',render);
  </script>
</body>
</html>
