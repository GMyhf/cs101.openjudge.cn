<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>题库目录 · CS101</title>
<style>
  :root { --ink:#17221d; --muted:#6b7a72; --line:#d9e0da; --ok:#2f7d55; --none:#a8b2ab; --bg:#f7f9f7; }
  * { box-sizing: border-box; }
  body { font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink);
         margin:0; padding:28px 20px 60px; background:#fff; }
  .wrap { max-width:980px; margin:0 auto; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 22px; }
  .sub a { color:#3d8b68; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center;
         position:sticky; top:0; background:#fff; padding:12px 0; border-bottom:1px solid var(--line); z-index:2; }
  input[type=search], select { padding:9px 11px; border:1px solid var(--line); border-radius:5px; font:inherit; }
  input[type=search] { flex:1; min-width:200px; }
  label.chk { display:flex; align-items:center; gap:6px; color:var(--muted); cursor:pointer; }
  .count { color:var(--muted); margin:14px 0 6px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { font-weight:600; color:var(--muted); font-size:13px; position:sticky; top:57px; background:#fff; }
  tr:hover td { background:var(--bg); }
  td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  a.pid { color:#3d8b68; text-decoration:none; font-weight:600; }
  a.pid:hover { text-decoration:underline; }
  .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; white-space:nowrap; }
  .tag.ok { background:#e7f3ec; color:var(--ok); }
  .tag.none { background:#f0f2f0; color:var(--none); }
  .go { color:var(--muted); text-decoration:none; }
  .go:hover { color:#3d8b68; }
  .empty { padding:40px 0; text-align:center; color:var(--muted); }
  @media (max-width:620px) { th:nth-child(4), td:nth-child(4) { display:none; } }
</style>
<div class="wrap">
  <h1>题库目录</h1>
  <p class="sub">标注每道题在本地是否有测试数据可判。<a href="/">返回首页</a></p>

  <div class="bar">
    <input type="search" id="q" placeholder="搜索题号，如 01003 / E19942" autocomplete="off">
    <select id="book"><option value="">全部题库</option></select>
    <label class="chk"><input type="checkbox" id="only" checked> 只看可判的</label>
  </div>

  <p class="count" id="count">加载中…</p>
  <table>
    <thead><tr><th>题号</th><th>题库</th><th>本地数据</th><th>组数</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="empty" id="empty" hidden>没有符合条件的题目。</p>
</div>

<script>
const els = { q: q, book: book, only: only, rows: rows, count: count, empty: empty };
let all = [];

fetch('/api/catalog', { credentials: 'same-origin' })
  .then(r => r.json())
  .then(data => {
    all = data.problems || [];
    for (const b of [...new Set(all.map(p => p.book))].sort()) {
      els.book.insertAdjacentHTML('beforeend', `<option value="${b}">${b}</option>`);
    }
    render();
  })
  .catch(() => { els.count.textContent = '题库加载失败。'; });

function judgeable(p) { return (p.test_count || 0) > 0; }

function render() {
  const term = els.q.value.trim().toLowerCase();
  const book = els.book.value;
  const onlyOk = els.only.checked;
  const hits = all.filter(p =>
    (!book || p.book === book) &&
    (!onlyOk || judgeable(p)) &&
    (!term || p.id.toLowerCase().includes(term)));

  const total = all.length, ok = all.filter(judgeable).length;
  els.count.textContent = `显示 ${hits.length} 题 · 全库 ${ok}/${total} 有本地数据`;
  els.empty.hidden = hits.length > 0;
  // 一次性拼串再写入：全库 1800+ 行，逐行 append 会明显卡顿
  els.rows.innerHTML = hits.slice(0, 600).map(p => {
    const has = judgeable(p);
    return `<tr>
      <td class="num"><a class="pid" href="${p.path}">${p.id}</a></td>
      <td>${p.book}</td>
      <td><span class="tag ${has ? 'ok' : 'none'}">${has ? '可判' : '暂无数据'}</span></td>
      <td class="num">${has ? p.test_count : '—'}</td>
      <td><a class="go" href="${p.path}submit/">${has ? '去提交 →' : ''}</a></td>
    </tr>`;
  }).join('');
  if (hits.length > 600) {
    els.count.textContent += `（只列出前 600 条，请用搜索缩小范围）`;
  }
}

for (const el of [els.q, els.book, els.only]) {
  el.addEventListener('input', render);
}
</script>
</html>
