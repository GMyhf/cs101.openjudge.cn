<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
__THEME_HEAD__
<title>题库目录 · CS101 本机判题</title>
<style>
  * { box-sizing: border-box; }
  body { font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink);
         margin:0; padding:0 0 60px; background:var(--panel); }
  .wrap { max-width:980px; margin:0 auto; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 22px; }
  .sub a { color:var(--accent); }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center;
         position:sticky; top:0; background:var(--panel); padding:12px 0; border-bottom:1px solid var(--line); z-index:2; }
  input[type=search], select { padding:9px 11px; border:1px solid var(--line); border-radius:5px; font:inherit; }
  input[type=search] { flex:1; min-width:200px; }
  label.chk { display:flex; align-items:center; gap:6px; color:var(--muted); cursor:pointer; }
  .count { color:var(--muted); margin:14px 0 6px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { font-weight:600; color:var(--muted); font-size:13px; position:sticky; top:57px; background:var(--panel); }
  tr:hover td { background:var(--bg); }
  td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  a.pid { color:var(--accent); text-decoration:none; font-weight:600; }
  a.pid:hover { text-decoration:underline; }
  .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; white-space:nowrap; }
  .tag.ok { background:var(--badge-ac-bg); color:var(--ok); }
  .tag.none { background:var(--soft); color:var(--none); }
  .empty { padding:40px 0; text-align:center; color:var(--muted); }
  .pagination { display:flex; justify-content:center; align-items:center; gap:12px; padding:18px 0; }
  .pagination button { padding:6px 12px; border:1px solid var(--line); border-radius:5px; background:var(--panel); font:inherit; cursor:pointer; }
  .pagination button:disabled { opacity:.45; cursor:default; }
  @media (max-width:620px) { th:nth-child(4), td:nth-child(4) { display:none; } }
</style>
<header class="topbar"><a class="brand" href="/"><span class="mark">CS</span><span>CS101 题库</span></a><nav class="topnav"><a href="/problems/">题库</a><a href="/history/">提交记录</a><a href="/help/">说明</a><button id="theme" type="button" class="ghost theme-toggle">深色</button><a id="account" href="/auth/login/">登录</a></nav></header>
<div class="wrap">
  <h1 id="pageTitle">题库目录</h1>
  <p class="sub">标注每道题在本地是否有测试数据可判。<a href="/history/">提交记录</a> · <a href="/">返回首页</a></p>

  <div class="bar">
    <input type="search" id="q" placeholder="搜索题号，如 01003 / E19942" autocomplete="off">
    <select id="book"><option value="">全部题库</option></select>
    <label class="chk"><input type="checkbox" id="only" checked> 只看可判的</label>
  </div>

  <p class="count" id="count">加载中…</p>
  <div class="table-wrap"><table>
    <thead><tr><th>题目ID</th><th>标题</th><th>通过率</th><th>通过人数</th><th>尝试人数</th><th>本地数据</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="pagination"><button id="prev" type="button">上一页</button><span id="pageInfo"></span><button id="next" type="button">下一页</button></div>
  <p class="empty" id="empty" hidden>没有符合条件的题目。</p>
</div>

<script>
const els = { q: q, book: book, only: only, rows: rows, count: count, empty: empty };
let all = [], bookMeta = {}, pageNumber = 1, dataUniqueTotal = 0, dataUniqueTested = 0;
const pageSize = 50;
const requestedBook = new URLSearchParams(location.search).get('book') || '';

fetch('/api/catalog', { credentials: 'same-origin' })
  .then(r => r.json())
  .then(data => {
    all = data.problems || [];
    bookMeta = data.book_meta || {};
    dataUniqueTotal = data.unique_total || 0;
    dataUniqueTested = data.unique_tested_count || 0;
    for (const b of [...new Set(all.map(p => p.book))].sort()) {
      els.book.insertAdjacentHTML('beforeend', `<option value="${b}">${(bookMeta[b] || {}).name || b}</option>`);
    }
    if ([...els.book.options].some(option => option.value === requestedBook)) {
      els.book.value = requestedBook;
      els.only.checked = false;
      document.querySelector('#pageTitle').textContent = (bookMeta[requestedBook] || {}).name || requestedBook;
    }
    render();
  })
  .catch(() => { els.count.textContent = '题库加载失败。'; });

function judgeable(p) { return (p.test_count || 0) > 0; }
function titleOf(p) { return (p.title || p.id).replace(new RegExp('^' + p.id + '\\s*[:：]\\s*', 'i'), '') || p.id; }

function render() {
  const term = els.q.value.trim().toLowerCase();
  const book = els.book.value;
  const onlyOk = els.only.checked;
  const hits = all.filter(p =>
    (!book || p.book === book) &&
    (!onlyOk || judgeable(p)) &&
    (!term || p.id.toLowerCase().includes(term)));

  const total = dataUniqueTotal, ok = dataUniqueTested;
  const pages = Math.max(1, Math.ceil(hits.length / pageSize));
  pageNumber = Math.min(pageNumber, pages);
  const visible = hits.slice((pageNumber - 1) * pageSize, pageNumber * pageSize);
  els.count.textContent = `显示 ${hits.length} 题`;
  els.empty.hidden = hits.length > 0;
  // 一次性拼串再写入：全库 1800+ 行，逐行 append 会明显卡顿
  els.rows.innerHTML = visible.map(p => {
    const has = judgeable(p);
    return `<tr>
      <td class="num"><a class="pid" href="${p.path}">${p.id}</a></td>
      <td><a class="pid" href="${p.path}">${titleOf(p)}</a></td>
      <td class="num">${p.pass_rate || '—'}</td>
      <td class="num">${p.accepted_count ? `<a class="pid" href="/history/?book=${encodeURIComponent(p.book)}&problem=${encodeURIComponent(p.id)}">${p.accepted_count}</a>` : '—'}</td>
      <td class="num">${p.attempt_count ? `<a class="pid" href="/history/?book=${encodeURIComponent(p.book)}&problem=${encodeURIComponent(p.id)}">${p.attempt_count}</a>` : '—'}</td>
      <td><span class="tag ${has ? 'ok' : 'none'}">${has ? '可判' : '暂无数据'}</span></td>
    </tr>`;
  }).join('');
  pageInfo.textContent = `第 ${pageNumber} / ${pages} 页`;
  prev.disabled = pageNumber <= 1;
  next.disabled = pageNumber >= pages;
}

for (const el of [els.q, els.book, els.only]) {
  el.addEventListener('input', () => { pageNumber = 1; render(); });
}
prev.addEventListener('click', () => { pageNumber -= 1; render(); });
next.addEventListener('click', () => { pageNumber += 1; render(); });
</script>
<script>const themeBtn=document.querySelector('#theme');function applyTheme(n){document.documentElement.dataset.theme=n;themeBtn.textContent=n==='dark'?'浅色':'深色';try{localStorage.setItem('cs101-theme',n)}catch(e){}}applyTheme(document.documentElement.dataset.theme==='dark'?'dark':'light');themeBtn.onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');fetch('/api/me').then(r=>r.json()).then(d=>{if(d.authenticated){account.textContent=d.user;account.href='/history/?mine=1'}}).catch(()=>{});</script>
</html>
